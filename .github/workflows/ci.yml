name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` runs the `prepare` script, so this also proves the build works.
      - run: npm ci

      - run: npm run typecheck

      # Runs against test/fake-agy only. The real `agy` binary is never invoked
      # here — every real invocation would spend account quota.
      - run: npm test

      - name: verify the packed tarball has the built entry points
        run: |
          npm pack --silent >/dev/null
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/dist/(server|runner|gate)\.js$'

  install-smoke:
    name: install the tarball and start the launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # The failure this catches is the one nobody sees in a terminal: a
      # GUI-launched client runs the server with a PATH that has no
      # version-manager node in it, the launcher is what survives that, and
      # nothing in the unit suite executes the launcher at all.
      - name: install into a throwaway prefix and start the server through the launcher
        run: |
          set -eu
          tarball="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          fakehome="$(mktemp -d)"
          state="$(mktemp -d)"

          npm install -g --prefix "$prefix" "./${tarball}"

          HOME="$fakehome" AGY_WORKER_HOME="$state" \
            "$prefix/bin/agy-worker-setup" --client claude

          launcher="$state/bin/agy-worker-mcp"
          test -x "$launcher" || { echo "launcher not installed at $launcher" >&2; exit 1; }

          # No inherited PATH at all: only the launcher's own recorded paths and
          # its version-manager fallbacks can make this work.
          response="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            | env -i HOME="$fakehome" AGY_WORKER_HOME="$state" PATH=/usr/bin:/bin \
                "$launcher" 2>/dev/null | head -n 1)"

          echo "$response"
          echo "$response" | grep -q '"serverInfo"' || {
            echo "the launcher did not answer an MCP initialize" >&2
            exit 1
          }

          # `--doctor` reports on the whole environment, and a CI runner is not a
          # developer's machine: it has no Antigravity CLI to find, and nobody
          # has run `claude mcp add` in it (`--client claude` prints that
          # command, it does not run it). Those two checks are expected to fail
          # here. Everything else it reports is about the installation this job
          # just performed, so the assertion is that those two are the *only*
          # failures — a regression in the launcher, the state home, or the
          # skills still turns this red.
          set +e
          doctor="$(HOME="$fakehome" AGY_WORKER_HOME="$state" \
            "$prefix/bin/agy-worker-setup" --doctor 2>&1)"
          set -e
          echo "$doctor"

          # Assert the report exists before asserting things about its contents:
          # a doctor that died before printing anything has no [FAIL] lines
          # either, and would otherwise sail through the check below.
          echo "$doctor" | grep -q '^agy-worker-setup --doctor$' || {
            echo "--doctor did not produce a report" >&2
            exit 1
          }

          unexpected="$(echo "$doctor" | grep '^  \[FAIL\]' \
            | grep -v 'agy binary' | grep -v 'MCP registration' || true)"
          if [ -n "$unexpected" ]; then
            echo "doctor failed a check this job is responsible for:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
