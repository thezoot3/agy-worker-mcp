name: Release

# Stages the package for npm. Two triggers, both manual in spirit:
#   - a pushed tag `vX.Y.Z` whose version matches package.json
#   - workflow_dispatch with `dry_run: true` (default) to rehearse without staging
# Nothing here runs on ordinary pushes.
#
# This workflow does not publish. It stages (`npm stage publish`), and a human
# with interactive 2FA approves — `npm stage approve`, or npmjs.com. That
# asymmetry is the point: OIDC makes the workflow file itself a publishing
# credential, and this package spawns agents on a user's machine with
# `--dangerously-skip-permissions`, so a compromised repository must not be able
# to reach those machines without a person present. Releases here are rare
# enough that one approval costs nothing.
#
# Staged publishing needs npm >= 11.15.0 and Node >= 22.14 (setup-node's `22.x`
# resolves well past that; the npm version is asserted below).
#
# Authentication is npm trusted publishing (OIDC): no long-lived token, the
# `id-token: write` permission below is what authenticates the run. npm only
# lets you register a trusted publisher for a package that already exists, so
# the very first publish has to be bootstrapped with a short-lived granular
# token in `NPM_TOKEN`. npm tries OIDC first and falls back to that token, so
# the same workflow covers both: set the secret for the bootstrap run, register
# the trusted publisher on npmjs.com, then delete the secret.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything but skip `npm publish`'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1 and staged publishing >= 11.15.0;
      # node 22.x still bundles npm 10. Assert rather than hope: a silently old
      # npm fails at the publish step with "Unknown command: stage", after the
      # tag is already pushed and the run is most of the way through.
      - name: npm new enough for staged trusted publishing
        run: |
          npm install -g npm@latest
          version="$(npm --version)"
          echo "npm ${version}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 15 ]; }; then
            echo "npm ${version} is too old for 'npm stage publish' (needs >= 11.15.0)" >&2
            exit 1
          fi

      - run: npm ci

      - name: tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${pkg}" >&2
            exit 1
          fi

      # Same gate as CI: typecheck + fake-agy suite. The real `agy` binary is
      # never invoked (it would spend account quota).
      - run: npm run typecheck
      - run: npm test

      - name: verify the packed tarball
        run: |
          npm pack --silent >/dev/null
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/dist/(server|runner|gate)\.js$'
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/skills/agy-ceiling/SKILL\.md$'
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/commands/agy-ceiling\.md$'
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/dist/setup\.js$'
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/CHANGELOG\.md$'
          tar -tzf agy-worker-mcp-*.tgz | grep -E 'package/dist/contract/schema\.sql$'

      # Rehearses the real command, not a neighbouring one: `npm publish
      # --dry-run` would keep passing long after the trusted publisher was
      # narrowed to stage-only.
      - name: stage (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm stage publish --dry-run --provenance --access public

      # Staging, not publishing. Nothing is on the registry when this step
      # succeeds: a human still has to run `npm stage approve agy-worker-mcp@<version>`
      # (or approve on npmjs.com) with interactive 2FA. `npm stage publish`
      # itself never prompts for 2FA regardless of token type, which is what
      # makes it usable from CI; `approve` and `reject` always do, which is what
      # keeps a compromised workflow from reaching a user's machine on its own.
      # Provenance is attached here, at staging, not at approval.
      - name: stage for approval
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: say what is left to do
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Staged, not published"
            echo
            echo "\`agy-worker-mcp@${version}\` is staged. Nothing is on the registry yet."
            echo
            echo "A human with 2FA finishes it:"
            echo
            echo '```sh'
            echo "npm stage view agy-worker-mcp@${version}"
            echo "npm stage approve agy-worker-mcp@${version}"
            echo '```'
            echo
            echo "or approve it on npmjs.com. \`npm stage reject\` throws it away."
          } >> "$GITHUB_STEP_SUMMARY"
